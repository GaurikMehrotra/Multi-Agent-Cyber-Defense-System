[project]
name = "multi-agent-cyber-defense"
version = "0.1.0"
requires-python = ">=3.12"
description = "Evidence-grounded defensive investigation in an isolated lab"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
